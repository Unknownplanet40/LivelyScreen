name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish WinUI 3 Release (win-x64)
        run: |
          dotnet publish src/LivelyScreen.WinUI/LivelyScreen.WinUI.csproj -c Release -p:PublishProfile=win-x64

      - name: Package Release ZIP
        shell: pwsh
        run: |
          $publishPath = "src/LivelyScreen.WinUI/bin/Release/net9.0-windows10.0.26100.0/win-x64/publish"
          Compress-Archive -Path "$publishPath/*" -DestinationPath "LivelyScreen-win-x64.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            LivelyScreen-win-x64.zip
          generate_release_notes: true
